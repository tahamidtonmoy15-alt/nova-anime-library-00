name: Build NOVA Android APK
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
      - name: Restore private release signing key
        id: signing
        env:
          NOVA_KEYSTORE_BASE64: ${{ secrets.NOVA_KEYSTORE_BASE64 }}
          NOVA_STORE_PASSWORD: ${{ secrets.NOVA_STORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: |
          if [ -n "$NOVA_KEYSTORE_BASE64" ] && [ -n "$NOVA_STORE_PASSWORD" ] && [ -n "$NOVA_KEY_ALIAS" ] && [ -n "$NOVA_KEY_PASSWORD" ]; then
            echo "$NOVA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nova-release.jks"
            test -s "$RUNNER_TEMP/nova-release.jks"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build APK
        env:
          NOVA_SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          NOVA_KEYSTORE_PATH: ${{ runner.temp }}/nova-release.jks
          NOVA_STORE_PASSWORD: ${{ secrets.NOVA_STORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
          IS_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ "$NOVA_SIGNING_ENABLED" = "true" ] && [ -s "$RUNNER_TEMP/nova-release.jks" ]; then
            gradle --no-daemon --stacktrace clean assembleRelease
            echo "APK_PATH=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          elif [ "$IS_RELEASE_TAG" = "true" ]; then
            echo "ERROR: A version tag cannot publish a debug-signed APK." >&2
            echo "Configure NOVA_KEYSTORE_BASE64, NOVA_STORE_PASSWORD, NOVA_KEY_ALIAS, and NOVA_KEY_PASSWORD in GitHub Actions secrets, then retry the tag build." >&2
            exit 1
          else
            echo "No signing secrets found; building a debug-signed test APK for this branch run."
            gradle --no-daemon --stacktrace clean assembleDebug
            echo "APK_PATH=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi
      - name: Verify APK output
        run: |
          test -s "$APK_PATH"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK_PATH"
          sha256sum "$APK_PATH"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: NOVA-Android-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.APK_PATH }}
          generate_release_notes: true
